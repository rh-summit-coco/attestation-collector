apiVersion: apps/v1
kind: Deployment
metadata:
  name: attestation-collector
  labels:
    app: attestation-collector
    app.kubernetes.io/name: attestation-collector
    app.kubernetes.io/component: collector
    app.kubernetes.io/part-of: coco-compliance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attestation-collector
  template:
    metadata:
      labels:
        app: attestation-collector
    spec:
      containers:
      - name: collector
        image: image-registry.openshift-image-registry.svc:5000/raj-compliance-dashboard/attestation-collector:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PORT
          value: "8080"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/ready
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
      securityContext:
        runAsNonRoot: true
