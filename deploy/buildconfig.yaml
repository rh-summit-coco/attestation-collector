apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: attestation-collector
  labels:
    app: attestation-collector
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: attestation-collector:latest
  triggers: []
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: attestation-collector
  labels:
    app: attestation-collector
