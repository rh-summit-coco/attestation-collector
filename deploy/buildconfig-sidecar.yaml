apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: attestation-sidecar-secure
  namespace: raj-compliance-dashboard
  labels:
    app: attestation-sidecar-secure
    app.kubernetes.io/component: attestation-sidecar
    app.kubernetes.io/instance: attestation-sidecar-secure
    app.kubernetes.io/name: attestation-sidecar
spec:
  failedBuildsHistoryLimit: 5
  output:
    to:
      kind: ImageStreamTag
      name: attestation-sidecar-secure:latest
  postCommit: {}
  resources: {}
  runPolicy: Serial
  source:
    git:
      uri: https://github.com/rh-summit-coco/attestation-collector.git
      ref: main
    type: Git
    contextDir: .
  strategy:
    dockerStrategy:
      dockerfilePath: Dockerfile.sidecar
    type: Docker
  successfulBuildsHistoryLimit: 5
  triggers:
  - github:
      secret: secure-sidecar-webhook-secret
    type: GitHub
  - generic:
      secret: secure-sidecar-generic-secret
    type: Generic
  - type: ConfigChange
  - imageChange: {}
    type: ImageChange
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: attestation-sidecar-secure
  namespace: raj-compliance-dashboard
  labels:
    app: attestation-sidecar-secure
    app.kubernetes.io/component: attestation-sidecar
    app.kubernetes.io/instance: attestation-sidecar-secure
spec:
  lookupPolicy:
    local: false